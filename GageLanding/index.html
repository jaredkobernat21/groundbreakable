<style>
  /* ---------- Gage Landing video hero ----------
     Namespaced gage- so nothing here collides with the shared stylesheet.
     Three source videos crossfade/loop in sequence as a full-bleed
     background; a dark scrim + centered wordmark sit on top. */
  .gage-hero{ padding:0; }
  .gage-video-bg{ position:absolute; inset:0; z-index:0; background:var(--charcoal); }
  .gage-video{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    opacity:0;
    transition:opacity 0.7s ease;
  }
  .gage-video.active{ opacity:1; }
  .gage-scrim{ position:absolute; inset:0; background:rgba(12,11,8,0.46); }
  .gage-hero-content{
    position:relative; z-index:1;
    width:100%; height:100%;
    min-height:100svh;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  .gage-hero-title{
    font-family:var(--serif);
    font-weight:500;
    font-size:clamp(38px,7vw,84px);
    letter-spacing:-0.01em;
    line-height:1.1;
    color:#FFFFFF;
    text-align:center;
    margin:0;
    text-shadow:0 2px 40px rgba(0,0,0,0.55);
  }
</style>

<script src="../js/main.js"></script>
<script>
  (function () {
    var videos = Array.prototype.slice.call(document.querySelectorAll('.gage-video'));
    if (!videos.length) return;

    var i = 0;

    function play(index) {
      videos.forEach(function (v, vi) {
        v.classList.toggle('active', vi === index);
      });
      var current = videos[index];
      current.currentTime = 0;
      var p = current.play();
      if (p && p.catch) p.catch(function () {});
    }

    videos.forEach(function (v, vi) {
      v.addEventListener('ended', function () {
        i = (vi + 1) % videos.length;
        play(i);
      });
    });

    play(0);
  })();
</script>
