<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 240 240"
     width="240" height="240"
     role="img" aria-labelledby="title desc"
     style="color:#111111">
  <title id="title">Groundbreakable icon</title>
  <desc id="desc">A combined map pin and lightbulb icon.</desc>
  
  <g id="groundbreakable-mark" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <!-- light rays -->
    <path d="M120 18 L120 2" stroke-width="6"/>
    <path d="M84 29 L73 17" stroke-width="6"/>
    <path d="M156 29 L167 17" stroke-width="6"/>

    <!-- map-pin / bulb outer shape -->
    <path d="M120 42
             C89 42 66 65 66 95
             C66 119 80 136 93 151
             C103 162 110 173 114 184
             L126 184
             C130 173 137 162 147 151
             C160 136 174 119 174 95
             C174 65 151 42 120 42 Z"
          stroke-width="6"/>

    <!-- center -->
    <circle cx="120" cy="94" r="13" fill="currentColor" stroke="none"/>

    <!-- bulb base -->
    <path d="M103 193 H137" stroke-width="6"/>
    <path d="M108 205 H132" stroke-width="6"/>
    <path d="M114 215 H126 L120 222 Z" fill="currentColor" stroke="none"/>
  </g>

</svg>
